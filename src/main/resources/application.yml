spring:
  application:
    name: shopping-mall
  cloud:
    aws:
      secretsmanager:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopping_mall?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
        time_zone: Asia/Seoul
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${BATCH_SCHEMA_INITIALIZE:never}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:shopping-mall-order-workers}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.shoppingmall.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.shoppingmall.order.event.OrderRequestedEvent
    listener:
      ack-mode: record
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
      concurrency: ${KAFKA_ORDER_CONSUMER_CONCURRENCY:1}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:local-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:local-naver-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

app:
  kafka:
    topics:
      purchase-command: ${PURCHASE_COMMAND_TOPIC:mall.purchase.commands.v1}
      purchase-event: ${PURCHASE_EVENT_TOPIC:mall.purchase.events.v1}
