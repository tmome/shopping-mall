<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shopping Mall</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header class="topbar">
		<div>
			<p class="eyebrow">Shopping Mall Admin</p>
			<h1>상품 관리</h1>
		</div>
		<div class="topbar-actions">
			<div class="status" id="apiStatus">API 확인 중</div>
			<div class="auth-box">
				<span id="authStatus">로그인 확인 중</span>
				<div class="auth-actions" id="loginActions">
					<a class="login kakao" href="/oauth2/authorization/kakao">Kakao</a>
					<a class="login naver" href="/oauth2/authorization/naver">Naver</a>
				</div>
				<form id="logoutForm" action="/logout" method="post" hidden>
					<button class="secondary" type="submit">로그아웃</button>
				</form>
			</div>
		</div>
	</header>

	<main class="layout">
		<section class="panel">
			<div class="section-head">
				<h2>상품 등록</h2>
				<p>이름, 가격, 재고를 입력하면 바로 목록에 반영됩니다.</p>
			</div>
			<form id="productForm" class="form">
				<label>
					<span>상품명</span>
					<input id="name" name="name" type="text" placeholder="예: Keyboard" autocomplete="off" required>
				</label>
				<label>
					<span>가격</span>
					<input id="price" name="price" type="number" min="1" step="100" placeholder="99000" required>
				</label>
				<label>
					<span>재고</span>
					<input id="stockQuantity" name="stockQuantity" type="number" min="0" step="1" placeholder="10" required>
				</label>
				<button type="submit">등록</button>
			</form>
			<p class="message" id="message" role="status"></p>
		</section>

		<section class="panel products-panel">
			<div class="section-head row">
				<div>
					<h2>상품 목록</h2>
					<p>현재 저장된 상품을 보여줍니다.</p>
				</div>
				<button class="secondary" id="refreshButton" type="button">새로고침</button>
			</div>
			<div class="product-list" id="productList"></div>
		</section>
	</main>

	<script src="/app.js"></script>
</body>
</html>
