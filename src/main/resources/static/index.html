<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Shopping Mall</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header class="topbar">
		<div>
			<p class="eyebrow">PETHROOM STYLE ADMIN</p>
			<h1>상품 운영</h1>
		</div>
		<div class="topbar-actions">
			<div class="status" id="apiStatus">API 확인 중</div>
			<div class="auth-box">
				<span id="authStatus">로그인 확인 중</span>
				<div class="auth-actions" id="loginActions">
					<a class="login kakao" href="/oauth2/authorization/kakao">Kakao</a>
					<a class="login naver" href="/oauth2/authorization/naver">Naver</a>
				</div>
				<form id="logoutForm" action="/logout" method="post" hidden>
					<button class="secondary" type="submit">로그아웃</button>
				</form>
			</div>
		</div>
	</header>

	<main class="layout">
		<section class="panel">
			<div class="section-head">
				<h2>상품 등록</h2>
				<p>운영 상품 정보 입력</p>
			</div>
			<form id="productForm" class="form">
				<label>
					<span>상품명</span>
					<input id="name" name="name" type="text" autocomplete="off" required>
				</label>
				<label>
					<span>가격</span>
					<input id="price" name="price" type="number" min="1" step="100" required>
				</label>
				<label>
					<span>재고</span>
					<input id="stockQuantity" name="stockQuantity" type="number" min="0" step="1" required>
				</label>
				<button type="submit">등록</button>
			</form>
			<p class="message" id="message" role="status"></p>
		</section>

		<section class="panel products-panel">
			<div class="section-head row">
				<div>
					<h2>상품 목록</h2>
					<p>실시간 상품 데이터</p>
				</div>
				<div class="list-tools">
					<form id="searchForm" class="search-form">
						<label class="search-label" for="keywordInput">
							<span>검색</span>
							<input id="keywordInput" name="keyword" type="search" autocomplete="off" placeholder="상품명">
						</label>
						<button class="secondary" type="submit">검색</button>
						<button class="secondary" id="clearSearchButton" type="button">초기화</button>
					</form>
					<label class="select-label" for="sortSelect">
						<span>정렬</span>
						<select id="sortSelect" name="sort">
							<option value="latest">최신순</option>
							<option value="recommended">추천순</option>
							<option value="popular">인기순</option>
						</select>
					</label>
					<button class="secondary" id="refreshButton" type="button">새로고침</button>
				</div>
			</div>
			<div class="product-list" id="productList"></div>
			<div class="pagination" id="pagination" hidden>
				<button class="secondary" id="prevPageButton" type="button">이전</button>
				<span id="pageInfo"></span>
				<button class="secondary" id="nextPageButton" type="button">다음</button>
			</div>
		</section>
	</main>

	<script src="/app.js"></script>
</body>
</html>
