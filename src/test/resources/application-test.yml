spring:
  datasource:
    url: jdbc:h2:mem:shopping_mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  kafka:
    listener:
      auto-startup: false

app:
  kafka:
    topic-auto-create-enabled: false
