services:
  mysql:
    image: mysql:8.4
    container_name: shopping-mall-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: shopping_mall
      MYSQL_USER: shopping
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ushopping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
